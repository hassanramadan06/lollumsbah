<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Admin sign in</title>
  <link rel="stylesheet" href="/admin/css/admin.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body style="display:grid;place-items:center;min-height:100vh;background:linear-gradient(135deg,#e0e7ff,#fce7f3)">
  <form id="f" class="card" style="width:420px;max-width:92vw;padding:32px">
    <h1 style="margin-bottom:6px">Admin sign in</h1>
    <p style="color:var(--muted);margin-bottom:20px">Restricted area.</p>
    <div class="form-group"><label>Email</label><input name="email" type="email" required/></div>
    <div class="form-group"><label>Password</label><input name="password" type="password" required/></div>
    <button class="btn btn-primary" style="width:100%" type="submit">Sign in</button>
    <p style="margin-top:16px;font-size:13px;color:var(--muted);text-align:center">Default: admin@kidsstore.com / Admin@12345</p>
  </form>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/admin/js/admin-ui.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        const { token, user } = await API.auth.login(fd.get('email'), fd.get('password'));
        if (user.role !== 'admin') { ADMIN.toast('Not an admin account', 'error'); return; }
        API.setToken(token); API.setUser(user);
        location.href = '/admin/index.html';
      } catch (err) { ADMIN.toast(err.message, 'error'); }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Reports — Admin</title>
  <link rel="stylesheet" href="/admin/css/admin.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout">
    <div id="sidebar-root"></div>
    <main class="main">
      <div class="topbar"><h1>Sales Reports</h1></div>
      <div class="card mb-20" style="margin-bottom:20px">
        <h3>Daily sales (last 30 days)</h3>
        <canvas id="chart" class="chart"></canvas>
      </div>
      <div class="card">
        <h3 style="margin-bottom:16px">Top-selling products</h3>
        <table><thead><tr><th>#</th><th>Product</th><th>Units sold</th><th>Revenue</th></tr></thead><tbody id="top"></tbody></table>
      </div>
    </main>
  </div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/admin/js/admin-ui.js"></script>
  <script>
    if (!ADMIN.ensureAdmin()) {} else {
      ADMIN.renderSidebar('reports');
      (async () => {
        try {
          const r = await API.admin.reports();
          const canvas = document.getElementById('chart');
          const ctx = canvas.getContext('2d');
          const W = canvas.width = canvas.offsetWidth * devicePixelRatio;
          const H = canvas.height = 260 * devicePixelRatio;
          ctx.clearRect(0, 0, W, H);
          const data = r.salesByDay || [];
          const pad = 40 * devicePixelRatio;
          if (!data.length) { ctx.fillStyle = '#9ca3af'; ctx.fillText('No data', 20, 40); }
          else {
            const max = Math.max(...data.map(d => Number(d.total))) || 1;
            const bw = (W - pad * 2) / data.length;
            data.forEach((d, i) => {
              const h = (Number(d.total) / max) * (H - pad * 2);
              const x = pad + i * bw, y = H - pad - h;
              const g = ctx.createLinearGradient(0, y, 0, H - pad);
              g.addColorStop(0, '#6366f1'); g.addColorStop(1, '#a5b4fc');
              ctx.fillStyle = g; ctx.fillRect(x + 2, y, bw - 4, h);
            });
          }
          document.getElementById('top').innerHTML = (r.topProducts || []).map((t, i) =>
            `<tr><td>${i+1}</td><td>${t.productName}</td><td>${t.sold}</td><td>${ADMIN.formatPrice(t.revenue)}</td></tr>`
          ).join('') || '<tr><td colspan="4" style="text-align:center;color:#9ca3af">No data</td></tr>';
        } catch (err) { ADMIN.toast(err.message, 'error'); }
      })();
    }
  </script>
</body>
</html>

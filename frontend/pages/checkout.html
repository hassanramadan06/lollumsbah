<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Checkout — Little Stars</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header-root"></div>

  <main class="container section">
    <h1 class="section-title">Checkout</h1>
    <div class="cart-layout">
      <form id="coForm" class="cart-summary" style="height:auto">
        <h3>Shipping details</h3>
        <div class="form-row mt-10">
          <div class="form-group"><label>Full name</label><input name="customerName" required/></div>
          <div class="form-group"><label>Email</label><input name="customerEmail" type="email" required/></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Phone</label><input name="customerPhone" required/></div>
          <div class="form-group"><label>City</label><input name="city" required/></div>
        </div>
        <div class="form-group"><label>Shipping address</label><textarea name="shippingAddress" rows="3" required></textarea></div>
        <div class="form-group"><label>Order notes (optional)</label><textarea name="notes" rows="2"></textarea></div>

        <h3 class="mt-20">Payment</h3>
        <div class="form-group">
          <label class="chk"><input type="radio" name="paymentMethod" value="cod" checked/> Cash on delivery</label>
          <label class="chk"><input type="radio" name="paymentMethod" value="card"/> Credit / Debit card (demo)</label>
          <label class="chk"><input type="radio" name="paymentMethod" value="wallet"/> Wallet (demo)</label>
        </div>

        <button class="btn btn-primary btn-block mt-10" type="submit">Place order</button>
      </form>

      <aside class="cart-summary">
        <h3>Your order</h3>
        <div id="itemsPreview" class="mt-10" style="max-height:300px;overflow:auto"></div>
        <div class="summary-row mt-20"><span>Subtotal</span><span id="pSub">—</span></div>
        <div class="summary-row"><span>Discount</span><span id="pDisc">—</span></div>
        <div class="summary-row"><span>Shipping</span><span id="pShip">—</span></div>
        <div class="summary-total"><span>Total</span><span id="pTotal">—</span></div>
      </aside>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    let items = []; let discount = 0; const SHIPPING = 5;
    const couponCode = sessionStorage.getItem('checkoutCoupon') || '';

    async function init() {
      if (API.getToken()) {
        const list = await API.cart.list();
        items = list.map(ci => ({
          productId: ci.productId, size: ci.size, color: ci.color, quantity: ci.quantity,
          name: ci.product?.name, image: ci.product?.mainImage,
          price: Number(ci.product?.discountPrice || ci.product?.price || 0),
        }));
        const me = API.getUser();
        if (me) {
          document.querySelector('[name="customerName"]').value = me.name || '';
          document.querySelector('[name="customerEmail"]').value = me.email || '';
        }
      } else {
        items = JSON.parse(localStorage.getItem('guestCart') || '[]');
        if (!items.length) { UI.toast('Your cart is empty', 'error'); setTimeout(() => location.href = '/pages/cart.html', 600); return; }
        for (const g of items) {
          if (!g.name) { try { const p = await API.products.get(g.productId); g.name = p.name; g.price = Number(p.discountPrice || p.price); g.image = p.mainImage; } catch (_) {} }
        }
      }
      if (!items.length) { UI.toast('Your cart is empty', 'error'); setTimeout(() => location.href = '/pages/cart.html', 600); return; }
      render();
    }

    function render() {
      document.getElementById('itemsPreview').innerHTML = items.map(i => `
        <div class="flex gap-10 mb-10" style="align-items:center">
          <img src="${i.image || ''}" style="width:50px;height:60px;object-fit:cover;border-radius:8px"/>
          <div style="flex:1">
            <div style="font-weight:600">${i.name || 'Product'}</div>
            <div class="text-muted" style="font-size:12px">${i.quantity} × ${UI.formatPrice(i.price)} ${i.size ? '· ' + i.size : ''} ${i.color ? '· ' + i.color : ''}</div>
          </div>
          <div style="font-weight:700">${UI.formatPrice(i.price * i.quantity)}</div>
        </div>
      `).join('');

      const sub = items.reduce((s, i) => s + i.price * i.quantity, 0);
      refreshCoupon(sub);
    }

    async function refreshCoupon(sub) {
      if (couponCode) {
        try { const r = await API.orders.validateCoupon(couponCode, sub); discount = Number(r.discount || 0); }
        catch (_) { discount = 0; }
      }
      const total = Math.max(0, sub - discount + SHIPPING);
      document.getElementById('pSub').textContent = UI.formatPrice(sub);
      document.getElementById('pDisc').textContent = discount ? '−' + UI.formatPrice(discount) : '—';
      document.getElementById('pShip').textContent = UI.formatPrice(SHIPPING);
      document.getElementById('pTotal').textContent = UI.formatPrice(total);
    }

    document.getElementById('coForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const body = {
        customerName: fd.get('customerName'),
        customerEmail: fd.get('customerEmail'),
        customerPhone: fd.get('customerPhone'),
        city: fd.get('city'),
        shippingAddress: fd.get('shippingAddress'),
        notes: fd.get('notes'),
        paymentMethod: fd.get('paymentMethod'),
        shippingCost: SHIPPING,
        couponCode: couponCode || undefined,
        items: items.map(i => ({ productId: i.productId, size: i.size, color: i.color, quantity: i.quantity })),
      };
      try {
        const order = await API.orders.checkout(body);
        if (!API.getToken()) localStorage.removeItem('guestCart');
        sessionStorage.removeItem('checkoutCoupon');
        UI.toast('Order placed! #' + order.orderNumber, 'success');
        setTimeout(() => location.href = `/pages/order-success.html?n=${encodeURIComponent(order.orderNumber)}`, 600);
      } catch (err) { UI.toast(err.message, 'error'); }
    });

    init();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact — Little Stars</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header-root"></div>
  <main class="container section">
    <div class="panel">
      <h1>We'd love to hear from you</h1>
      <p class="sub">Questions about sizes, orders, or partnerships? Send us a message.</p>
      <form id="f">
        <div class="form-row">
          <div class="form-group"><label>Name</label><input name="name" required/></div>
          <div class="form-group"><label>Email</label><input name="email" type="email" required/></div>
        </div>
        <div class="form-group"><label>Subject</label><input name="subject" required/></div>
        <div class="form-group"><label>Message</label><textarea name="message" rows="5" required></textarea></div>
        <button class="btn btn-primary btn-block" type="submit">Send message</button>
      </form>
      <div class="text-muted mt-20" style="font-size:14px">
        📍 12 Playful Street, Cairo &nbsp;·&nbsp; 📞 +20 100 000 0000 &nbsp;·&nbsp; ✉️ hello@littlestars.shop
      </div>
    </div>
  </main>
  <div id="footer-root"></div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      UI.toast('Thanks! We received your message.', 'success');
      e.target.reset();
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Product — Little Stars</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header-root"></div>

  <main class="container section">
    <div id="pdRoot"><div class="loader dark"></div></div>
    <section class="mt-30">
      <h2 class="section-title">Customer Reviews</h2>
      <div id="reviewsList" class="mt-20"></div>
      <div id="reviewForm" class="mt-20 panel" style="max-width:100%;margin:20px 0;display:none">
        <h3>Leave a review</h3>
        <div class="form-group">
          <label>Your rating</label>
          <div id="ratingStars" style="font-size:28px;color:#e5e7eb;cursor:pointer;letter-spacing:4px">★★★★★</div>
        </div>
        <div class="form-group">
          <label>Comment</label>
          <textarea id="reviewComment" rows="3" placeholder="Share your thoughts..."></textarea>
        </div>
        <button class="btn btn-primary" id="submitReview">Submit review</button>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get('slug');
    if (!slug) location.href = '/pages/products.html';

    const state = { product: null, size: null, color: null, qty: 1, rating: 5 };

    async function load() {
      try {
        const p = await API.products.get(slug);
        state.product = p;
        document.title = `${p.name} — Little Stars`;
        render(p);
        loadReviews(p.id);
      } catch (err) {
        document.getElementById('pdRoot').innerHTML = `<p class="empty">⚠️ ${err.message}</p>`;
      }
    }

    function render(p) {
      const images = (p.images && p.images.length ? p.images.map(i => i.url) : [p.mainImage || '']);
      const sizes = [...new Set((p.variants || []).map(v => v.size))];
      const colors = [...new Set((p.variants || []).map(v => v.color))];
      const colorMap = {};
      (p.variants || []).forEach(v => { if (!colorMap[v.color]) colorMap[v.color] = v.colorHex || '#ccc'; });

      const price = Number(p.discountPrice || p.price);
      const old = p.discountPrice ? `<span class="old">${UI.formatPrice(p.price)}</span>` : '';

      document.getElementById('pdRoot').innerHTML = `
        <div class="pd">
          <div class="pd-gallery">
            <div class="pd-thumbs" id="pdThumbs">
              ${images.map((u, i) => `<img src="${u}" data-i="${i}" class="${i===0?'active':''}" alt="${p.name}"/>`).join('')}
            </div>
            <div class="pd-main"><img id="pdMain" src="${images[0]}" alt="${p.name}"/></div>
          </div>
          <div class="pd-info fade-up">
            <div class="text-muted" style="font-size:13px;">${p.category?.name || ''} · Age ${p.ageGroup}</div>
            <h1>${p.name}</h1>
            <div class="rating" style="color:var(--accent);font-size:18px">${'★'.repeat(Math.round(p.rating||0)).padEnd(5,'☆')} <small style="color:var(--muted)">(${p.reviewsCount || 0} reviews)</small></div>
            <div class="pd-price"><span class="now">${UI.formatPrice(price)}</span>${old}</div>
            <p class="text-muted">${p.description || ''}</p>

            ${sizes.length ? `<div><div class="options-label">Size</div><div class="options" id="sizeOpts">
              ${sizes.map(s => `<button class="option-pill" data-size="${s}">${s}</button>`).join('')}
            </div></div>` : ''}

            ${colors.length ? `<div><div class="options-label">Color</div><div class="options" id="colorOpts">
              ${colors.map(c => `<button class="color-swatch" data-color="${c}" style="background:${colorMap[c]}" title="${c}"></button>`).join('')}
            </div></div>` : ''}

            <div class="options-label">Quantity</div>
            <div class="qty-ctl">
              <button id="qMinus">−</button>
              <input id="qty" type="number" min="1" value="1"/>
              <button id="qPlus">+</button>
            </div>

            <div class="flex gap-10 mt-20">
              <button class="btn btn-primary" id="addBtn" style="flex:1">Add to cart</button>
              <button class="btn btn-ghost" id="wishBtn">♡ Wishlist</button>
            </div>
            <div class="text-muted mt-20" style="font-size:13px">
              SKU: ${p.sku || '-'} · Stock: ${p.stock ?? '-'}
            </div>
          </div>
        </div>
      `;

      document.getElementById('pdThumbs').addEventListener('click', (e) => {
        const t = e.target.closest('img'); if (!t) return;
        document.querySelectorAll('#pdThumbs img').forEach(i => i.classList.remove('active'));
        t.classList.add('active');
        document.getElementById('pdMain').src = t.src;
      });

      document.querySelectorAll('#sizeOpts button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#sizeOpts button').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); state.size = b.dataset.size;
      }));
      document.querySelectorAll('#colorOpts button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#colorOpts button').forEach(x => x.classList.remove('active'));
        b.classList.add('active'); state.color = b.dataset.color;
      }));

      document.getElementById('qMinus').onclick = () => { const q = document.getElementById('qty'); q.value = Math.max(1, Number(q.value) - 1); };
      document.getElementById('qPlus').onclick = () => { const q = document.getElementById('qty'); q.value = Number(q.value) + 1; };

      document.getElementById('addBtn').onclick = async () => {
        const qty = Number(document.getElementById('qty').value) || 1;
        if (sizes.length && !state.size) return UI.toast('Please select a size', 'error');
        if (colors.length && !state.color) return UI.toast('Please select a color', 'error');
        try {
          if (API.getToken()) {
            await API.cart.add({ productId: p.id, size: state.size, color: state.color, quantity: qty });
          } else {
            const cart = JSON.parse(localStorage.getItem('guestCart') || '[]');
            const key = [p.id, state.size, state.color].join('|');
            const existing = cart.find(i => [i.productId, i.size, i.color].join('|') === key);
            if (existing) existing.quantity += qty;
            else cart.push({ productId: p.id, size: state.size, color: state.color, quantity: qty, name: p.name, price: price, image: p.mainImage });
            localStorage.setItem('guestCart', JSON.stringify(cart));
          }
          UI.toast('Added to cart', 'success');
          UI.renderHeader();
        } catch (err) { UI.toast(err.message, 'error'); }
      };

      document.getElementById('wishBtn').onclick = async () => {
        if (!API.getToken()) return UI.toast('Sign in to use wishlist', 'error');
        try { await API.wishlist.add(p.id); UI.toast('Added to wishlist', 'success'); UI.renderHeader(); }
        catch (err) { UI.toast(err.message, 'error'); }
      };

      if (API.getToken()) document.getElementById('reviewForm').style.display = 'block';
    }

    async function loadReviews(pid) {
      const list = document.getElementById('reviewsList');
      try {
        const reviews = await API.reviews.listForProduct(pid);
        if (!reviews.length) return list.innerHTML = '<p class="empty">Be the first to review this product.</p>';
        list.innerHTML = reviews.map(r => `
          <div class="panel" style="max-width:100%;margin:10px 0;padding:16px">
            <div class="flex-between">
              <b>${r.user?.name || 'Customer'}</b>
              <span style="color:var(--accent)">${'★'.repeat(r.rating).padEnd(5,'☆')}</span>
            </div>
            <div class="text-muted" style="font-size:12px">${new Date(r.createdAt).toLocaleDateString()}</div>
            <p class="mt-10">${(r.comment || '').replace(/</g, '&lt;')}</p>
          </div>
        `).join('');
      } catch (err) { list.innerHTML = `<p class="empty">${err.message}</p>`; }
    }

    // Rating input
    const stars = document.getElementById('ratingStars');
    stars.addEventListener('mouseover', (e) => {
      const rect = stars.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      const r = Math.max(1, Math.min(5, Math.round(pct * 5)));
      stars.textContent = '★'.repeat(r).padEnd(5, '★');
      stars.style.color = '#fbbf24';
      state.rating = r;
    });
    stars.addEventListener('mouseout', () => {
      stars.textContent = '★'.repeat(state.rating).padEnd(5, '★');
      stars.style.color = '#fbbf24';
    });
    stars.textContent = '★★★★★'; stars.style.color = '#fbbf24';

    document.getElementById('submitReview').onclick = async () => {
      if (!API.getToken()) return UI.toast('Sign in to review', 'error');
      try {
        await API.reviews.add(state.product.id, { rating: state.rating, comment: document.getElementById('reviewComment').value.trim() });
        UI.toast('Thanks for your review!', 'success');
        document.getElementById('reviewComment').value = '';
        loadReviews(state.product.id);
      } catch (err) { UI.toast(err.message, 'error'); }
    };

    load();
  </script>
</body>
</html>

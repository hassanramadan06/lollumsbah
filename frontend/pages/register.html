<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Create account — Little Stars</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header-root"></div>
  <main class="container">
    <div class="panel">
      <h1>Create your account ✨</h1>
      <p class="sub">Shop faster and save favorites.</p>
      <form id="f">
        <div class="form-group"><label>Full name</label><input name="name" required/></div>
        <div class="form-group"><label>Email</label><input name="email" type="email" required/></div>
        <div class="form-group"><label>Password</label><input name="password" type="password" minlength="6" required/></div>
        <div class="form-row">
          <div class="form-group"><label>Phone</label><input name="phone"/></div>
          <div class="form-group"><label>City</label><input name="city"/></div>
        </div>
        <div class="form-group"><label>Address</label><input name="address"/></div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
      <p class="text-center mt-20">Already have an account? <a href="/pages/login.html" style="color:var(--primary);font-weight:700">Sign in</a></p>
    </div>
  </main>
  <div id="footer-root"></div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const payload = Object.fromEntries(fd.entries());
      try {
        const { token, user } = await API.auth.register(payload);
        API.setToken(token); API.setUser(user);
        UI.toast('Welcome!', 'success');
        setTimeout(() => location.href = '/index.html', 400);
      } catch (err) { UI.toast(err.message, 'error'); }
    });
  </script>
</body>
</html>

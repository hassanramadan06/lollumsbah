<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Wishlist — Little Stars</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="header-root"></div>
  <main class="container section">
    <h1 class="section-title">My Wishlist</h1>
    <div class="products mt-20" id="grid"><div class="loader dark"></div></div>
  </main>
  <div id="footer-root"></div>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/product-card.js"></script>
  <script>
    if (!API.getToken()) {
      UI.toast('Sign in to view wishlist', 'error');
      setTimeout(() => location.href = '/pages/login.html?next=' + encodeURIComponent('/pages/wishlist.html'), 600);
    } else {
      (async () => {
        const host = document.getElementById('grid');
        try {
          const items = await API.wishlist.list();
          if (!items.length) return host.innerHTML = '<p class="empty">Your wishlist is empty.</p>';
          host.innerHTML = items.map(i => renderProductCard(i.product)).join('');
        } catch (err) { host.innerHTML = `<p class="empty">${err.message}</p>`; }
      })();
    }
  </script>
</body>
</html>
